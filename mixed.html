<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0518">
    <title>Обыкновенные ↔ смешанные</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="math.html" class="back-btn">← В меню</a>

    <h1>Обыкновенные ↔ смешанные</h1>

    <!-- Переключатель режима -->
    <div class="mode-switch">
        <button class="mode-btn active" data-mode="to-mixed" type="button">
            В смешанное
        </button>
        <button class="mode-btn" data-mode="to-improper" type="button">
            В неправильную
        </button>
    </div>

    <!-- Подсказка -->
    <div class="mode-hint" id="modeHint">
        Введите неправильную дробь — получите смешанное число.
    </div>

    <!-- Поле ввода -->
    <div class="input-row">
        <input type="text" id="inputVal" class="full-width" placeholder="Например: 7/4" autocomplete="off">
    </div>

    <button class="calc-btn" id="calcBtn">Преобразовать</button>

    <!-- Результат -->
    <div class="result" id="result">
        <div class="result-title">Ответ</div>
        <div class="translate-result" id="answer">—</div>

        <div class="result-title" style="margin-top:15px;">Пошаговое решение</div>
        <div class="steps" id="steps"></div>
    </div>

    <script>
        let mode = 'to-mixed';

        const inputVal = document.getElementById('inputVal');
        const modeHint = document.getElementById('modeHint');
        const calcBtn = document.getElementById('calcBtn');
        const resultBlock = document.getElementById('result');
        const answerEl = document.getElementById('answer');
        const stepsEl = document.getElementById('steps');

        // === Переключение режима ===
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                updateModeUI();
            });
        });

        function updateModeUI() {
            resultBlock.classList.remove('visible');
            if (mode === 'to-mixed') {
                modeHint.textContent = 'Введите неправильную дробь — получите смешанное число.';
                inputVal.placeholder = 'Например: 7/4 или 15/4';
            } else {
                modeHint.textContent = 'Введите смешанное число — получите неправильную дробь.';
                inputVal.placeholder = 'Например: 1 3/4 или 2 1/3';
            }
        }

        // === НОД ===
        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) [a, b] = [b, a % b];
            return a || 1;
        }

        // === Форматирование ===
        function fmt(n) {
            return n.toLocaleString('ru-RU');
        }

        // === Неправильная дробь → смешанное ===
        function toMixed(num, den) {
            if (den === 0) return null;

            const steps = [];

            // Знак
            let sign = 1;
            if (num < 0) { sign = -1; num = -num; }
            if (den < 0) { sign *= -1; den = -den; }

            // Целая часть и остаток
            const whole = Math.floor(num / den);
            const rem = num % den;

            let answer;
            if (rem === 0) {
                answer = `${sign * whole}`;
                steps.push(`Дробь ${sign < 0 ? '-' : ''}${num}/${den} — на самом деле целое число.`);
                steps.push(`${num} ÷ ${den} = ${whole} (без остатка)`);
                steps.push(`Ответ: ${sign * whole}`);
            } else if (whole === 0) {
                answer = `${sign * num}/${den}`;
                steps.push(`Числитель ${num} меньше знаменателя ${den} — это правильная дробь.`);
                steps.push(`Смешанное число не получится: остаётся ${sign < 0 ? '-' : ''}${num}/${den}`);
            } else {
                answer = `${sign < 0 ? '-' : ''}${whole} ${rem}/${den}`;
                steps.push(`Делим числитель на знаменатель с остатком:`);
                steps.push(`${num} ÷ ${den} = ${whole} (остаток ${rem})`);
                steps.push(`Целая часть = ${whole}, остаток = ${rem} → числитель дробной части = ${rem}`);
                steps.push(`Знаменатель остаётся прежним: ${den}`);
                steps.push(`Ответ: ${sign < 0 ? '-' : ''}${whole} ${rem}/${den}`);
            }

            return { answer, steps };
        }

        // === Смешанное → неправильная дробь ===
        function toImproper(whole, num, den, sign) {
            if (den === 0) return null;

            const steps = [];

            const product = whole * den;
            const newNum = product + num;
            const finalNum = sign * newNum;

            steps.push(`Формула: целая часть × знаменатель + числитель`);
            steps.push(`= ${whole} × ${den} + ${num}`);
            steps.push(`= ${product} + ${num}`);
            steps.push(`= ${newNum}`);
            steps.push(`Знаменатель остаётся прежним: ${den}`);

            // Сокращение (если возможно)
            const g = gcd(Math.abs(finalNum), den);
            let finalDen = den;
            let reducedNum = finalNum;

            if (g > 1) {
                reducedNum = finalNum / g;
                finalDen = den / g;
                steps.push(`Сокращаем на НОД(${Math.abs(finalNum)}, ${den}) = ${g}:`);
                steps.push(`${finalNum}/${den} = ${reducedNum}/${finalDen}`);
            }

            const answer = `${reducedNum}/${finalDen}`;
            steps.push(`Ответ: ${answer}`);

            return { answer, steps };
        }

        // === Кнопка "Преобразовать" ===
        calcBtn.addEventListener('click', () => {
            const raw = inputVal.value.trim();
            if (raw === '') {
                showError('Введите значение!');
                return;
            }

            const cleaned = raw.replace(/\s+/g, ' ');

            // Режим "в смешанное" — ожидаем дробь вида a/b или целое число
            if (mode === 'to-mixed') {
                // Разбираем: может быть "7/4", "-7/4", "5"
                let sign = 1;
                let workStr = cleaned;
                if (workStr.startsWith('-')) {
                    sign = -1;
                    workStr = workStr.slice(1).trim();
                }

                // Если это целое
                if (/^\d+$/.test(workStr)) {
                    const n = parseInt(workStr, 10) * sign;
                    answerEl.textContent = `${n}`;
                    stepsEl.innerHTML = '';
                    const steps = [`Это целое число, преобразование не требуется.`, `Ответ: ${n}`];
                    steps.forEach((s, i) => {
                        const d = document.createElement('div');
                        d.className = 'step';
                        d.innerHTML = `<span class="step-num">${i + 1}.</span> ${s}`;
                        stepsEl.appendChild(d);
                    });
                    resultBlock.classList.add('visible');
                    return;
                }

                // Дробь a/b
                const m = workStr.match(/^(\d+)\/(\d+)$/);
                if (!m) {
                    showError('Формат: 7/4 (неправильная дробь)');
                    return;
                }

                const num = parseInt(m[1], 10) * sign;
                const den = parseInt(m[2], 10);

                if (den === 0) {
                    showError('Знаменатель не может быть нулём!');
                    return;
                }

                const result = toMixed(num, den);
                answerEl.textContent = result.answer;
                stepsEl.innerHTML = '';
                result.steps.forEach((s, i) => {
                    const d = document.createElement('div');
                    d.className = 'step';
                    d.innerHTML = `<span class="step-num">${i + 1}.</span> ${s}`;
                    stepsEl.appendChild(d);
                });
                resultBlock.classList.add('visible');
                return;
            }

            // Режим "в неправильную" — ожидаем смешанное число или целое
            if (mode === 'to-improper') {
                let sign = 1;
                let workStr = cleaned;
                if (workStr.startsWith('-')) {
                    sign = -1;
                    workStr = workStr.slice(1).trim();
                }

                // Целое число
                if (/^\d+$/.test(workStr)) {
                    const n = parseInt(workStr, 10) * sign;
                    answerEl.textContent = `${n}/1`;
                    stepsEl.innerHTML = '';
                    const steps = [
                        `Целое число ${n} можно записать как дробь со знаменателем 1:`,
                        `${n} = ${n}/1`,
                        `Ответ: ${n}/1`
                    ];
                    steps.forEach((s, i) => {
                        const d = document.createElement('div');
                        d.className = 'step';
                        d.innerHTML = `<span class="step-num">${i + 1}.</span> ${s}`;
                        stepsEl.appendChild(d);
                    });
                    resultBlock.classList.add('visible');
                    return;
                }

                // Смешанное: "2 1/3"
                const m = workStr.match(/^(\d+)\s+(\d+)\/(\d+)$/);
                if (!m) {
                    showError('Формат: 2 1/3 (смешанное число)');
                    return;
                }

                const whole = parseInt(m[1], 10);
                const num = parseInt(m[2], 10);
                const den = parseInt(m[3], 10);

                if (den === 0) {
                    showError('Знаменатель не может быть нулём!');
                    return;
                }

                const result = toImproper(whole, num, den, sign);
                answerEl.textContent = result.answer;
                stepsEl.innerHTML = '';
                result.steps.forEach((s, i) => {
                    const d = document.createElement('div');
                    d.className = 'step';
                    d.innerHTML = `<span class="step-num">${i + 1}.</span> ${s}`;
                    stepsEl.appendChild(d);
                });
                resultBlock.classList.add('visible');
                return;
            }
        });

        // === Enter ===
        inputVal.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') calcBtn.click();
        });

        // === Ошибки ===
        function showError(text) {
            resultBlock.classList.remove('visible');
            const old = document.querySelector('.error');
            if (old) old.remove();

            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = text;
            calcBtn.insertAdjacentElement('afterend', err);

            setTimeout(() => err.remove(), 3000);
        }

        updateModeUI();
        inputVal.focus();
    </script>

</body>
</html>
