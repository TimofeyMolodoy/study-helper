<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0518">
    <title>НОД и НОК</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Кнопка выхода в меню -->
    <a href="math.html" class="back-btn">← В меню</a>

    <h1>НОД и НОК</h1>

    <!-- Список полей ввода -->
    <div class="inputs" id="inputs">
        <div class="input-row">
            <input type="number" placeholder="Число 1" class="num-input" inputmode="numeric">
            <button class="remove-btn" type="button">×</button>
        </div>
        <div class="input-row">
            <input type="number" placeholder="Число 2" class="num-input" inputmode="numeric">
            <button class="remove-btn" type="button">×</button>
        </div>
    </div>

    <!-- Кнопка добавить число -->
    <button class="add-btn" id="addBtn">+ Добавить число</button>

    <!-- Кнопка вычислить -->
    <button class="calc-btn" id="calcBtn">Вычислить</button>

    <!-- Результат -->
    <div class="result" id="result">
        <div class="result-row">
            <span class="result-label">НОД:</span>
            <span class="result-value" id="gcdResult">—</span>
        </div>
        <div class="result-row">
            <span class="result-label">НОК:</span>
            <span class="result-value" id="lcmResult">—</span>
        </div>
    </div>

    <script>
        const inputsContainer = document.getElementById('inputs');
        const addBtn = document.getElementById('addBtn');
        const calcBtn = document.getElementById('calcBtn');
        const resultBlock = document.getElementById('result');
        const gcdResult = document.getElementById('gcdResult');
        const lcmResult = document.getElementById('lcmResult');

        let counter = 2;

        function updatePlaceholders() {
            const rows = inputsContainer.querySelectorAll('.input-row');
            rows.forEach((row, i) => {
                row.querySelector('.num-input').placeholder = `Число ${i + 1}`;
                const removeBtn = row.querySelector('.remove-btn');
                removeBtn.style.display = rows.length > 1 ? 'block' : 'none';
            });
            counter = rows.length;
        }

        addBtn.addEventListener('click', () => {
            const row = document.createElement('div');
            row.className = 'input-row';
            row.innerHTML = `
                <input type="number" placeholder="Число" class="num-input" inputmode="numeric">
                <button class="remove-btn" type="button">×</button>
            `;
            inputsContainer.appendChild(row);

            row.querySelector('.remove-btn').addEventListener('click', () => {
                row.remove();
                updatePlaceholders();
            });

            row.querySelector('input').focus();
            updatePlaceholders();
        });

        document.querySelectorAll('.remove-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const row = e.target.closest('.input-row');
                if (inputsContainer.children.length > 1) {
                    row.remove();
                    updatePlaceholders();
                }
            });
        });

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) [a, b] = [b, a % b];
            return a;
        }

        function lcm(a, b) {
            if (a === 0 || b === 0) return 0;
            return Math.abs(a * b) / gcd(a, b);
        }

        function gcdArray(arr) {
            return arr.reduce((acc, val) => gcd(acc, val));
        }

        function lcmArray(arr) {
            return arr.reduce((acc, val) => lcm(acc, val));
        }

        calcBtn.addEventListener('click', () => {
            const allInputs = inputsContainer.querySelectorAll('.num-input');
            const numbers = [];

            for (let inp of allInputs) {
                const val = inp.value.trim();
                if (val === '') {
                    showError('Заполни все поля!');
                    return;
                }
                const num = parseInt(val, 10);
                if (isNaN(num) || num === 0) {
                    showError('Числа должны быть целыми и не равны нулю!');
                    return;
                }
                numbers.push(num);
            }

            if (numbers.length < 1) {
                showError('Введи хотя бы одно число!');
                return;
            }

            try {
                const g = gcdArray(numbers);
                const l = lcmArray(numbers);
                gcdResult.textContent = g.toLocaleString('ru-RU');
                lcmResult.textContent = l.toLocaleString('ru-RU');
                resultBlock.classList.add('visible');
            } catch (e) {
                showError('Ошибка вычисления. Проверь числа.');
            }
        });

        function showError(text) {
            resultBlock.classList.remove('visible');
            const old = document.querySelector('.error');
            if (old) old.remove();

            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = text;
            calcBtn.insertAdjacentElement('afterend', err);

            setTimeout(() => err.remove(), 2500);
        }

        updatePlaceholders();
    </script>

</body>
</html>
