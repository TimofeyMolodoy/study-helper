<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0518">
    <title>Калькулятор дробей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="math.html" class="back-btn">← В меню</a>

    <h1>Калькулятор дробей</h1>

    <!-- Первая дробь -->
    <div class="frac-row">
        <input type="text" id="frac1" class="full-width" placeholder="Например: 3/4 или 1 1/2" autocomplete="off">
    </div>

    <!-- Знак операции -->
    <div class="op-switch">
        <button class="op-btn active" data-op="+" type="button">+</button>
        <button class="op-btn" data-op="-" type="button">−</button>
        <button class="op-btn" data-op="×" type="button">×</button>
        <button class="op-btn" data-op="÷" type="button">÷</button>
    </div>

    <!-- Вторая дробь -->
    <div class="frac-row">
        <input type="text" id="frac2" class="full-width" placeholder="Например: 5/6 или 2 1/3" autocomplete="off">
    </div>

    <button class="calc-btn" id="calcBtn">Вычислить</button>

    <!-- Результат -->
    <div class="result" id="result">
        <div class="result-title">Ответ</div>
        <div class="translate-result" id="answer">—</div>

        <div class="result-title" style="margin-top:15px;">Пошаговое решение</div>
        <div class="steps" id="steps"></div>
    </div>

    <script>
        let operation = '+';

        const frac1Input = document.getElementById('frac1');
        const frac2Input = document.getElementById('frac2');
        const calcBtn = document.getElementById('calcBtn');
        const resultBlock = document.getElementById('result');
        const answerEl = document.getElementById('answer');
        const stepsEl = document.getElementById('steps');

        // === Переключение операции ===
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                operation = btn.dataset.op;
            });
        });

        // === Парсинг дроби ===
        function parseFraction(str) {
            str = str.trim().replace(/\s+/g, ' ');
            if (str === '') return null;

            let sign = 1;
            if (str.startsWith('-')) {
                sign = -1;
                str = str.slice(1).trim();
            }

            const mixedMatch = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
            if (mixedMatch) {
                const whole = parseInt(mixedMatch[1], 10);
                const num = parseInt(mixedMatch[2], 10);
                const den = parseInt(mixedMatch[3], 10);
                if (den === 0) return null;
                return {
                    num: sign * (whole * den + num),
                    den: den,
                    original: (sign < 0 ? '-' : '') + str
                };
            }

            const fracMatch = str.match(/^(\d+)\/(\d+)$/);
            if (fracMatch) {
                const num = parseInt(fracMatch[1], 10);
                const den = parseInt(fracMatch[2], 10);
                if (den === 0) return null;
                return {
                    num: sign * num,
                    den: den,
                    original: (sign < 0 ? '-' : '') + str
                };
            }

            const intMatch = str.match(/^\d+$/);
            if (intMatch) {
                const n = parseInt(str, 10);
                return {
                    num: sign * n,
                    den: 1,
                    original: (sign < 0 ? '-' : '') + str
                };
            }

            return null;
        }

        function gcd(a, b) {
            a = Math.abs(a);
            b = Math.abs(b);
            while (b !== 0) [a, b] = [b, a % b];
            return a || 1;
        }

        function lcm(a, b) {
            return Math.abs(a * b) / gcd(a, b);
        }

        function reduce(num, den) {
            if (den < 0) { num = -num; den = -den; }
            const g = gcd(num, den);
            return { num: num / g, den: den / g };
        }

        function fracStr(num, den) {
            if (den === 1) return `${num}`;
            return `${num}/${den}`;
        }

        function toMixed(num, den) {
            if (den === 1) return null;
            if (Math.abs(num) < den) return null;
            const sign = num < 0 ? '-' : '';
            const absNum = Math.abs(num);
            const whole = Math.floor(absNum / den);
            const rem = absNum % den;
            if (rem === 0) return null;
            return `${sign}${whole} ${rem}/${den}`;
        }

        function compute(a, b, op) {
            let num, den;
            if (op === '+') {
                num = a.num * b.den + b.num * a.den;
                den = a.den * b.den;
            } else if (op === '-') {
                num = a.num * b.den - b.num * a.den;
                den = a.den * b.den;
            } else if (op === '×') {
                num = a.num * b.num;
                den = a.den * b.den;
            } else if (op === '÷') {
                if (b.num === 0) return null;
                num = a.num * b.den;
                den = a.den * b.num;
            }
            return { num, den };
        }

        function buildSteps(a, b, op, raw, reduced) {
            const steps = [];
            const opWord = { '+': 'сложение', '-': 'вычитание', '×': 'умножение', '÷': 'деление' }[op];

            steps.push(`Операция: ${opWord} дробей ${a.original} и ${b.original}`);

            if (op === '+' || op === '-') {
                const commonDen = lcm(a.den, b.den);
                steps.push(`Общий знаменатель: НОК(${a.den}, ${b.den}) = ${commonDen}`);

                const mult1 = commonDen / a.den;
                const mult2 = commonDen / b.den;
                const newNum1 = a.num * mult1;
                const newNum2 = b.num * mult2;

                if (mult1 !== 1) {
                    steps.push(`${a.original} = (${a.num} × ${mult1})/${commonDen} = ${newNum1}/${commonDen}`);
                } else {
                    steps.push(`${a.original} = ${a.num}/${commonDen}`);
                }
                if (mult2 !== 1) {
                    steps.push(`${b.original} = (${b.num} × ${mult2})/${commonDen} = ${newNum2}/${commonDen}`);
                } else {
                    steps.push(`${b.original} = ${b.num}/${commonDen}`);
                }

                const resultNum = op === '+' ? newNum1 + newNum2 : newNum1 - newNum2;
                steps.push(`${newNum1}/${commonDen} ${op} ${newNum2}/${commonDen} = ${resultNum}/${commonDen}`);
            }
            else if (op === '×') {
                steps.push(`${a.num}/${a.den} × ${b.num}/${b.den} = (${a.num} × ${b.num}) / (${a.den} × ${b.den}) = ${raw.num}/${raw.den}`);
            }
            else if (op === '÷') {
                steps.push(`Деление заменяем умножением на обратную дробь:`);
                steps.push(`${a.num}/${a.den} ÷ ${b.num}/${b.den} = ${a.num}/${a.den} × ${b.den}/${b.num} = ${raw.num}/${raw.den}`);
            }

            const g = gcd(raw.num, raw.den);
            if (g > 1) {
                steps.push(`Сокращаем на НОД(${Math.abs(raw.num)}, ${raw.den}) = ${g}:`);
                steps.push(`${raw.num}/${raw.den} = ${reduced.num}/${reduced.den}`);
            }

            const mixed = toMixed(reduced.num, reduced.den);
            if (mixed) {
                steps.push(`Выделяем целую часть: ${reduced.num}/${reduced.den} = ${mixed}`);
            }

            return steps;
        }

        calcBtn.addEventListener('click', () => {
            const s1 = frac1Input.value.trim();
            const s2 = frac2Input.value.trim();

            if (!s1 || !s2) {
                showError('Введите обе дроби!');
                return;
            }

            const a = parseFraction(s1);
            const b = parseFraction(s2);

            if (!a) {
                showError(`Не могу разобрать первую дробь: "${s1}". Формат: 3/4 или 1 1/2`);
                return;
            }
            if (!b) {
                showError(`Не могу разобрать вторую дробь: "${s2}". Формат: 3/4 или 1 1/2`);
                return;
            }

            const raw = compute(a, b, operation);
            if (!raw) {
                showError('Деление на ноль невозможно!');
                return;
            }

            const reduced = reduce(raw.num, raw.den);
            const mixed = toMixed(reduced.num, reduced.den);

            let answerHTML = fracStr(reduced.num, reduced.den);
            if (mixed) {
                answerHTML = `${fracStr(reduced.num, reduced.den)} = ${mixed}`;
            }
            answerEl.textContent = answerHTML;

            const steps = buildSteps(a, b, operation, raw, reduced);
            stepsEl.innerHTML = '';
            steps.forEach((step, i) => {
                const div = document.createElement('div');
                div.className = 'step';
                div.innerHTML = `<span class="step-num">${i + 1}.</span> ${step}`;
                stepsEl.appendChild(div);
            });

            resultBlock.classList.add('visible');
        });

        function showError(text) {
            resultBlock.classList.remove('visible');
            const old = document.querySelector('.error');
            if (old) old.remove();

            const err = document.createElement('div');
            err.className = 'error';
            err.textContent = text;
            calcBtn.insertAdjacentElement('afterend', err);

            setTimeout(() => err.remove(), 3500);
        }

        frac1Input.focus();
    </script>

</body>
</html>
